name: offline_notes_sync
description: "Offline-first notes app with Firestore background sync."
publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.2"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  drift: ^2.32.1
  sqlite3: ^3.3.3
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  connectivity_plus: ^7.1.1
  uuid: ^4.5.3
  equatable: ^2.0.5

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  drift_dev: ^2.32.1
  build_runner: ^2.4.13
  mocktail: ^1.0.5
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true


